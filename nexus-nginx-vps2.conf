# EvoNexus VPS 2 — Nginx standalone com SSL
# HTTP  → redireciona para HTTPS
# HTTPS → proxies para dashboard (8080) e terminal (32352)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nexus_dashboard {
    server nexus-dashboard:8080;
    keepalive 32;
}

upstream nexus_terminal {
    server nexus-dashboard:32352;
    keepalive 32;
}

# HTTP — ACME challenge + redirect
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — reverse proxy para o Nexus
server {
    listen 443 ssl;
    server_name NEXUS_DOMAIN;          # ← substituir pelo domínio real

    ssl_certificate     /etc/letsencrypt/live/NEXUS_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/NEXUS_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Terminal WebSocket + REST → Node.js (32352)
    location /terminal/ {
        proxy_pass http://nexus_terminal/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dashboard Flask (8080)
    location / {
        proxy_pass http://nexus_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
